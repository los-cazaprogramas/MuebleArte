<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | MuebleArte</title>
    <link rel="icon" type="image/png" href="/assets/pestañaimg.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="/styles/header-footer.css" rel="stylesheet" type="text/css">
    <style>
        .btn-gold { background-color: #b58d3d; color: white; }
        .btn-gold:hover { background-color: #94712f; color: white; }
        .product-card { transition: transform 0.2s ease-in-out; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>

    <main class="container my-5 pt-4">
        <div class="mb-5">
            <h1 class="display-5 fw-bold" id="titulo-categoria" style="color: #0b1a30;">Cargando categoría...</h1>
            <p class="lead text-muted" id="descripcion-categoria">Descubre nuestra exclusiva colección de muebles artesanales de alta calidad.</p>
        </div>
        
        <div class="row row-cols-1 row-cols-md-4 g-4" id="contenedor-muebles">
            <div class="text-center w-100 py-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="text-muted mt-2">Consultando catálogo...</p>
            </div>
        </div>
    </main>

    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/scripts/carrito.js"></script> <script src="/js/categorias-dinamicas.js"></script> </body>
</html>
