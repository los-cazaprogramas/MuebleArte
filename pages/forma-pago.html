<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forma de pago - MuebleArte</title>
    <link rel="icon" type="image/png" href="/assets/pestañaimg.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="../styles/header-footer.css" rel="stylesheet">
    <link href="../styles/checkout.css" rel="stylesheet">
</head>
<body class="pagina-pasarela">

<header class="header-mueble-arte">
  <nav class="container-fluid d-flex align-items-center py-3 px-4 justify-content-between">
    <div class="logo-wrapper"><a href="/index.html"><img src="/assets/logo-heather.png" alt="Mueble Arte" class="header-logo"></a></div>
    <div class="contenedor-menu d-flex align-items-center">
      <ul class="nav align-items-center gap-3 mx-lg-3">
        <li><a href="/index.html" class="nav-link-custom">Inicio</a></li>
        <li><a href="/pages/about-us.html" class="nav-link-custom">Acerca de nosotros</a></li>
      </ul>
    </div>
  </nav>
</header>

<main class="container my-5">
    <div class="checkout-progress mb-5">
        <div class="step completed"><div class="step-circle"><i class="bi bi-check-lg"></i></div><span>Dirección</span></div>
        <div class="step active"><div class="step-circle">2</div><span>Pago</span></div>
        <div class="step"><div class="step-circle">3</div><span>Confirmación</span></div>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="checkout-card">
                <h1 class="h3 fw-bold mb-4"><i class="bi bi-credit-card-fill me-2" style="color: var(--dorado-acento);"></i>Forma de pago</h1>
                <form id="formPago" onsubmit="return false;">
                    <div class="mb-3"><label class="form-label">Número de tarjeta *</label><input type="text" class="form-control" placeholder="0000 0000 0000 0000" required></div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-7"><label class="form-label">Fecha de vencimiento *</label><input type="text" class="form-control" placeholder="MM/AA" required></div>
                        <div class="col-md-5"><label class="form-label">CVV *</label><input type="text" class="form-control" placeholder="123" required></div>
                    </div>
                    
                    <div class="d-flex justify-content-between gap-3">
                        <a href="./direccion-envio.html" class="btn btn-outline-dark btn-capsule px-4">Volver</a>
                        <a href="./confirmacion-pedido.html" class="btn btn-gold btn-capsule px-4 d-inline-flex align-items-center justify-content-center">Continuar →</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<div class="container-fluid mt-5 p-0 bg-marino">
    <div class="container" id="piepagina">
        <footer class="pt-5 pb-3"><p class="mb-0 text-white-50">© 2026 MuebleArte, Inc. Todos los derechos reservados.</p></footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
