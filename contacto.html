<body>
    
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom px-4 px-md-5 header-mueblearte sticky-top bg-white z-3">
    <div class="col-md-3 mb-2 mb-md-0">
      <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
        <svg class="bi" width="40" height="32" role="img" aria-label="Bootstrap"><use xlink:href="#bootstrap"></use></svg>
      </a>
    </div> 

    <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0"> 
        <li><a href="index.html" class="nav-link px-2 link-secondary">Inicio</a></li>
        <li><a href="aboutus.html" class="nav-link px-2 fw-bold">Acerca de nosotros</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Categorías
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="liberos.html">Libreros</a></li>
            <li><a class="dropdown-item" href="sillas.html">Sillas</a></li>
            <li><a class="dropdown-item" href="mesas.html">Mesas</a></li>
            <li><a class="dropdown-item" href="bases para cama.html">Bases para cama</a></li>
            <li><a class="dropdown-item" href="cajoneras.html">Cajoneras</a></li>
          </ul>
        </li>
        <li><a href="preguntasfrecuentes.html" class="nav-link px-2">Preguntas frecuentes</a></li>
        <li><a href="contacto.html" class="nav-link px-2">Contáctanos</a></li>
    </ul>

    <!--Botones de Carrito, Iniciar sesión y Registrarse modificados.-->
    <div class="col-md-3 text-end d-flex justify-content-end gap-2">
      <button type="button" class="btn btn-outline-marino">Carrito</button>
      <button type="button" class="btn btn-outline-marino">Inicia Sesión</button>
      <button type="button" class="btn btn-dorado">Registrate</button>
    </div>

<div class="container py-4">
  <div class="card shadow-sm p-4" style="max-width: 750px; margin: 0 auto; border-radius: 12px;">
    
    <h4 class="text-center fw-bold mb-4">Envíanos un Mensaje</h4>

    <!-- Fila: Nombre y Correo -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Nombre Completo <span class="text-danger">*</span></label>
        <input type="text" class="form-control" placeholder="Tu nombre">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
        <input type="email" class="form-control" placeholder="tu@email.com">
      </div>
    </div>

    <!-- Teléfono -->
    <div class="mb-3">
      <label class="form-label fw-semibold">Teléfono</label>
      <input type="tel" class="form-control" placeholder="+52 55 1234 5678">
    </div>

    <!-- Mensaje -->
    <div class="mb-4">
      <label class="form-label fw-semibold">Mensaje <span class="text-danger">*</span></label>
      <textarea class="form-control" rows="5" placeholder="Cuéntanos cómo podemos ayudarte..."></textarea>
    </div>

    <!-- Botón -->
    <div class="text-center">
      <button type="button" class="btn px-5 py-2 fw-semibold text-white" style="background-color: #b8860b; border-radius: 25px;">
        ✈ Enviar Mensaje
      </button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
