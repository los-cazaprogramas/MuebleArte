<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Añadir Mueble | MuebleArte Admin</title>
    <link rel="stylesheet" href="nuevo-mueble.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-container">
        
        <aside class="sidebar">
            <div class="sidebar-logo">
                <h2>MuebleArte <span>Admin</span></h2>
            </div>
            <nav class="sidebar-menu">
                <a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
                <a href="nuevo-mueble.html" class="active"><i class="fa-solid fa-plus"></i> Añadir Mueble</a>
                <a href="#"><i class="fa-solid fa-couch"></i> Inventario</a>
                <a href="#" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="main-header">
                <div class="welcome-text">
                    <h1>Añadir Nuevo Mueble</h1>
                    <p>Agrega las especificaciones del nuevo producto para guardarlo en la base de datos de MySQL.</p>
                </div>
                <div class="header-actions">
                    <a href="index.html" class="btn-secondary" style="text-decoration: none; display: inline-block;">
                        <i class="fa-solid fa-arrow-left"></i> Volver al Dashboard
                    </a>
                </div>
            </header>

            <section class="form-container">
                <form id="furniture-form">
                    
                    <div class="form-group">
                        <label for="furniture-name">Nombre del Mueble *</label>
                        <input type="text" id="furniture-name" required placeholder="Ej. Silla Nórdica de Roble">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="furniture-category">Categoría (Catálogo) *</label>
                            <select id="furniture-category" required>
                                <option value="">Selecciona una categoría...</option>
                                <option value="1">Sillas (ID: 1)</option>
                                <option value="2">Mesas (ID: 2)</option>
                                <option value="3">Sillones(ID: 3)</option>
                                <option value="4">Librero(ID: 4)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="furniture-price">Precio (MXN) *</label>
                            <input type="number" id="furniture-price" min="0" step="0.01" required placeholder="0.00">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="furniture-stock">Stock Inicial *</label>
                            <input type="number" id="furniture-stock" min="0" value="10" required placeholder="Cantidad de piezas">
                        </div>
                        <div class="form-group">
                            <label for="furniture-code">Código de Producto</label>
                            <input type="text" id="furniture-code" placeholder="Ej. MUE-NUEVO">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="furniture-description">Descripción Detallada *</label>
                        <textarea id="furniture-description" rows="4" required placeholder="Especificaciones de materiales, dimensiones..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Imagen del Mueble *</label>
                        <div class="image-upload-zone" id="upload-zone" style="cursor: pointer;">
                            <input type="file" id="image-input" accept="image/*" required style="display: none;">
                            <div class="upload-placeholder" id="upload-placeholder">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <p>Haz clic para seleccionar o arrastra la imagen aquí</p>
                                <span>Formatos admitidos: JPG, PNG (Max. 5MB)</span>
                            </div>
                            <img id="image-preview" class="preview-img" alt="Vista previa del mueble" style="display: none; max-width: 100%; height: auto; border-radius: 4px;">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">
                            <i class="fa-solid fa-save"></i> Registrar Mueble en Base de Datos
                        </button>
                    </div>

                </form>
            </section>

        </main>
    </div>

    <script src="mock-api.js"></script>
</body>
</html>
